name: pipeline-comercial

x-airflow: &airflow
  build: .
  image: pipeline-comercial:local
  environment: &ambiente
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_local@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-segredo_apenas_local}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'false'
    ERP_DSN: postgresql://leitor_erp:leitor_local@postgres:5432/erp
    METAS_API_URL: http://api-metas:8000
    PIPELINE_DESTINO: ${PIPELINE_DESTINO:-local}
    LOCAL_DB_PATH: /opt/airflow/dados/comercial.sqlite
    GCP_PROJECT_ID: ${GCP_PROJECT_ID:-data-engineering-portfolio-md}
    GOOGLE_CLOUD_PROJECT: ${GCP_PROJECT_ID:-pipeline-comercial-md}
    GOOGLE_CLOUD_QUOTA_PROJECT: ${GCP_PROJECT_ID:-pipeline-comercial-md}
    BQ_LOCATION: ${BQ_LOCATION:-US}
    GOOGLE_APPLICATION_CREDENTIALS: /opt/credentials/google.json
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin_local}
  volumes:
    - airflow-logs:/opt/airflow/logs
    - pipeline-dados:/opt/airflow/dados
    - ./secrets:/opt/credentials:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.8
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_local
    volumes:
      - postgres-dados:/var/lib/postgresql/data
      - ./sql/postgres/01_origem.sql:/docker-entrypoint-initdb.d/01_origem.sql:ro
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp -d erp']
      interval: 5s
      timeout: 5s
      retries: 20

  api-metas:
    <<: *airflow
    entrypoint: ['python', '-m', 'pipeline_comercial.api_metas']
    environment:
      API_DSN: postgresql://leitor_metas:metas_local@postgres:5432/erp
    ports: ['127.0.0.1:8000:8000']
    volumes: []
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=3)']
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow
    entrypoint: ['python', '/opt/airflow/scripts/iniciar_airflow.py']

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      api-metas:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8080/health", timeout=3)']
      interval: 15s
      timeout: 5s
      retries: 10

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      api-metas:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-cli:
    <<: *airflow
    profiles: ['ferramentas']
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      api-metas:
        condition: service_healthy

  testes:
    build: .
    image: pipeline-comercial:local
    profiles: ['ferramentas']
    entrypoint: ['python', '-m', 'pytest']
    command: ['-q']
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__UNIT_TEST_MODE: 'true'

  demo:
    build: .
    image: pipeline-comercial:local
    profiles: ['ferramentas']
    entrypoint: ['python', '-m', 'pipeline_comercial.cli']
    command: ['demo']

volumes:
  postgres-dados:
  airflow-logs:
  pipeline-dados:
