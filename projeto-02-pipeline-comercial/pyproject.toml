[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-comercial"
version = "0.1.0"
description = "Integração incremental de vendas do ERP e metas comerciais"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
cloud = ["psycopg[binary]==3.2.6", "google-cloud-bigquery==3.31.0"]
test = ["pytest==8.3.5", "PyYAML==6.0.2"]

[project.scripts]
pipeline-comercial = "pipeline_comercial.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipeline_comercial = ["sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
